services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tkd-backend
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/taekwondo.db}
    volumes:
      - db-data:/data
    networks:
      - app-net
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/api/belts')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./project
      dockerfile: Dockerfile
    container_name: tkd-frontend
    ports:
      - "${FRONTEND_PORT:-4000}:4000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-net
    restart: ${RESTART_POLICY:-unless-stopped}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  app-net:
    driver: bridge

volumes:
  db-data:
